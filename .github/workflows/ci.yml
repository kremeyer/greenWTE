name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  cuda-extras:
    # GitHub-hosted runners have no GPU: check that the CUDA extras resolve and install,
    # and that greenWTE warns and falls back to the CPU when CuPy cannot be loaded
    needs: pre-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
        extra: ['cuda12x', 'cuda13x']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix['python-version'] }}

      - name: Install with ${{ matrix.extra }} extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[${{ matrix.extra }}]"
          python -m pip check

      - name: Import without GPU
        run: |
          python - <<'PY'
          import warnings
          with warnings.catch_warnings(record=True) as w:
              warnings.simplefilter("always")
              import greenWTE
          assert not greenWTE.HAVE_GPU
          assert any("CuPy is installed but failed to load" in str(x.message) for x in w), [str(x.message) for x in w]
          print("CPU fallback warning emitted as expected")
          PY

  tests:
    needs: pre-commit
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      COVERAGE_PROCESS_START: pyproject.toml
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    continue-on-error: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix['python-version'] }}
          cache: 'pip'

      - name: Create venv & install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e . pytest pytest-cov

      - name: Run pytest (skip GPU)
        env:
          COVERAGE_RCFILE: pyproject.toml
          COVERAGE_PROCESS_START: pyproject.toml
        run: |
          .venv/bin/pytest

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
